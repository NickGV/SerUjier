product_decisions:
  stats_v1:
    - "Promedio por tipo de culto (per-servicio averages across the 9-value enum)"
    - "Top faltantes de miembros, ventana ultimos 90 dias"
    - "Seguimiento individual de AMIGOS (user's own emphasis): per-amigo last-attended service/date and days since last visit, to track how long a visitor has not returned"
  not_selected_v1:
    - "Tendencia de asistencia en el tiempo (week/month trend)"
    - "Miembros vs no-miembros"
  placement: "new Estadisticas tab/section inside historial (not enriching the list page)"
  visual: "recharts from v1 (shadcn chart primitives), lazy-loaded so the historial list bundle is not penalized"
  faltantes_window: "last 90 days"
  assumptions: "esMiembro/faltantes computed from CURRENT membership status; orphaned features/historial/components/historial/* deleted as cleanup; pre-existing 'Total Asistentes' label bug in historial/[id] fixed as minor ride-along"
proposal_confirmed_decisions:
  faltantes_denominator: "all servicio types count as a miss within the 90-day window (not dominical-only)"
  faltantes_scope: "only esMiembro true (diverges intentionally from historial/[id], which still counts all miembros; possible later alignment)"
  amigos_never_visited: "same single table, sorted last, rendered as 'nunca' (NOT a separate group)"
  date_filter_v1: "YES - desde/hasta range in the stats view scoping per-servicio averages and the chart; faltantes stays fixed 90 days; amigos last-visit stays all-time"
  placement_mechanism: "dedicated route segment src/app/(dashboard)/historial/estadisticas/ (static segment wins over [id]); no tabs.tsx primitive exists so a route is cheaper and auto-code-splits recharts"
  crud_consolidation: "DEFERRED - legacy shared/lib/utils.ts historial CRUD (~150 lines, live read path for delete + Excel/PDF/CSV export) is not repointed here; instead one tested normalizeHistorialRecord is introduced and adopted by both existing pages so no third normalization appears. Full consolidation recorded as a follow-up change."
notes:
  - "Product goal is open-ended ('estadísticas más útiles en historial'); proposal round must lock which stats ship first, placement, and chart-vs-cards."
  - "Pre-existing adjacent bug surfaced by exploration (out of scope unless owner pulls it in): historial/[id] third quick-stat card labeled 'Total Asistentes' renders total registered miembros, not attendees."
